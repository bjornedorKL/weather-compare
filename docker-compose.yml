services:
  postgres:
    image: postgres:16
    container_name: weathercompare-postgres
    environment:
      POSTGRES_DB: weathercompare
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather
    ports:
      - "5433:5432"
    volumes:
      - weathercompare-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather -d weathercompare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  weathercompare-pgdata:
